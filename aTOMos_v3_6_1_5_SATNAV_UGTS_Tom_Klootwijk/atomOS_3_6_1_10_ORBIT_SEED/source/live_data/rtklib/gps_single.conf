# Independent RTKLIB 2.4.2 p13 oracle: GPS L1 single point positioning.
# Broadcast orbit/clock/TGD, Klobuchar ionosphere, Saastamoinen atmosphere.
pos1-posmode       =single
pos1-frequency     =l1
pos1-soltype       =forward
pos1-elmask        =10
pos1-snrmask_r     =off
pos1-snrmask_b     =off
pos1-dynamics      =off
pos1-tidecorr      =off
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-navsys        =1
pos1-posopt1       =off
pos1-posopt2       =off
pos1-posopt3       =off
pos1-posopt4       =off
pos1-posopt5       =off
out-solformat      =xyz
out-outhead        =on
out-outopt         =on
out-timesys        =gpst
out-timeform       =hms
out-timendec       =3
out-solstatic      =all
out-height         =ellipsoidal
out-solstat        =2
